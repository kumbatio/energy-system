name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24.21.0 is what the package is developed on; 22 is the engines floor
        # consumers are promised, and the suite runs on it unchanged.
        node: ['22', '24.21.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pnpm/setup supersedes pnpm/action-setup + actions/setup-node: it
      # provisions both in one step, reading the pnpm version from
      # `packageManager` in package.json so CI cannot drift from local.
      # `install: false` keeps the explicit frozen-lockfile install below,
      # which is what makes a stale lockfile fail rather than get repaired.
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
      # The release-age gate is off by design (see pnpm-workspace.yaml); this
      # is the backstop that comment relies on.
      - run: pnpm audit --audit-level high
