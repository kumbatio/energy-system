name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pnpm/setup supersedes pnpm/action-setup + actions/setup-node: it
      # provisions both in one step, reading the pnpm version from
      # `packageManager` in package.json so CI cannot drift from local.
      # `install: false` keeps the explicit frozen-lockfile install below,
      # which is what makes a stale lockfile fail rather than get repaired.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate
